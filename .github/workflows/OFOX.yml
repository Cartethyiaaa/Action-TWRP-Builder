name: OrangeFox Build (Sync)

on:
  workflow_dispatch:
    inputs:
      FOX_BRANCH:
        description: 'OFOX Branch (12.1 / 14.1)'
        required: true
        default: '12.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/rinnsakaguchi/twrp_device_infinix_X6886'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'ofox-12.1'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/infinix/X6886'
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'X6886'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'ofox_X6886'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare Environment
      run: |
        sudo apt update
        sudo apt install -y git python3 tar

        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Sync OrangeFox Source
      run: |
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync

        ./orangefox_sync.sh \
          --branch ${{ github.event.inputs.FOX_BRANCH }} \
          --path $GITHUB_WORKSPACE/workspace

    - name: Clone Device Tree
      run: |
        cd workspace
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} \
          -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} \
          ./${{ github.event.inputs.DEVICE_PATH }}

    - name: Set Swap
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Build OrangeFox
      run: |
        cd workspace

        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_BUILD_TYPE=Unofficial

        source build/envsetup.sh

        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-userdebug

        m ofox -j$(nproc --all)

    - name: Upload Result
      uses: softprops/action-gh-release@v2
      with:
        files: |
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.img
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
        tag_name: ${{ github.run_id }}
        name: OFOX-${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}