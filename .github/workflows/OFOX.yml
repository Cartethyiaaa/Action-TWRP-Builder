name: OrangeFox - Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Branch'
        required: true
        default: '14.1'
        type: choice
        options:
        - 14.1
        - 12.1
        - 11.0
      DEVICE_TREE:
        description: 'Device Recovery Tree'
        required: true
        default: 'https://github.com/Cartethyiaaa/yo'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'Specify your device path.'
        required: true
        default: 'device/infinix/X6886'
      DEVICE_NAME:
        description: 'Specify your Device Codename.'
        required: true
        default: 'X6886'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'vendorboot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      CLEAN_BUILD:
        description: 'Force full clean build (slower, use only if build is broken/stale)'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build OFRP by ${{ github.actor }}
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FOX_DIR: ${{ github.workspace }}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Display Inputs
      run: |
        echo "::group::User Environment Variables"
        echo "Manifest Branch : ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Tree     : ${{ github.event.inputs.DEVICE_TREE }} (${{ github.event.inputs.DEVICE_TREE_BRANCH }})"
        echo "Device Path     : ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Name     : ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Build Target    : ${{ github.event.inputs.BUILD_TARGET }}image"
        echo "::endgroup::"

    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Build Environment
      run: |
        set -e
        sudo apt update
        sudo apt -y upgrade
        rm -rf scripts
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
        # android_build_env.sh usually installs ccache, but make sure it's there
        sudo apt -y install ccache

    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ github.event.inputs.DEVICE_NAME }}-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ github.event.inputs.DEVICE_NAME }}-${{ github.event.inputs.MANIFEST_BRANCH }}-

    - name: Set-up Manifest
      run: |
        set -e
        mkdir -p ${{ github.workspace }}/OrangeFox
        cd ${{ github.workspace }}/OrangeFox
        git config --global user.name "Samuel Kendall"
        git config --global user.email "kinguser981@gmail.com"
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync
        ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path "$FOX_DIR"

        # Fail fast with a clear message instead of a confusing error later
        # if the sync silently produced an incomplete tree.
        if [ ! -d "$FOX_DIR/build" ]; then
          echo "::error::Manifest sync did not produce a build/ directory at $FOX_DIR. Aborting."
          exit 1
        fi

    - name: Clone Device Tree
      run: |
        set -e
        cd "$FOX_DIR"
        rm -rf "${{ github.event.inputs.DEVICE_PATH }}"
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        cd ${{ github.event.inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Apply Patches
      run: |
        PATCH_DIR="${{ github.event.inputs.DEVICE_PATH }}/patches"
        if [ ! -d "$PATCH_DIR" ]; then
          echo "[*] No patches directory found, skipping."
          exit 0
        fi

        for f in $(find "$PATCH_DIR" -maxdepth 1 -type f | sort); do
          case "$f" in
            *.sh)
              echo "[*] Running script: $f"
              chmod +x "$f"
              bash "$f"
              ;;
            *.patch|*.diff)
              echo "[*] Applying patch: $f"
              git apply --directory=. --verbose "$f" \
                || patch -p1 --no-backup-if-mismatch < "$f"
              ;;
            *)
              echo "[!] Skipping unknown file type: $f"
              ;;
          esac
        done
      working-directory: ${{ env.FOX_DIR }}

    - name: Determine Lunch Combo
      id: lunch
      run: |
        # Confirmed from this device tree's own vendorsetup.sh:
        #   add_lunch_combo ofox_X6886-eng
        # The product is always registered as "ofox_<DEVICE_NAME>",
        # regardless of manifest branch. AOSP's release_config.mk error
        # output confirmed the only valid release name for fox_14.1 is "ap2a"
        # (not the "trunk_staging" default used by most other trees).
        echo "combo=ofox_${{ github.event.inputs.DEVICE_NAME }}-ap2a-eng" >> $GITHUB_OUTPUT

    - name: Building recovery
      run: |
        set -e
        cd "$FOX_DIR"
        export TERM=xterm
        export USE_CCACHE=1
        export CCACHE_EXEC=$(which ccache)
        export CCACHE_DIR=~/.ccache
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=6
        export ALLOW_MISSING_DEPENDENCIES=true
        ccache -M 30G
        ccache -z

        source build/envsetup.sh
        echo "[*] Trying lunch combo: ${{ steps.lunch.outputs.combo }}"
        if ! lunch ${{ steps.lunch.outputs.combo }}; then
          echo "::error::lunch failed for combo '${{ steps.lunch.outputs.combo }}'. If AOSP printed 'Available releases are: ...' above, that lists the exact release name this tree expects — rerun with that name substituted for 'trunk_staging'."
          exit 1
        fi

        if [ "${{ github.event.inputs.CLEAN_BUILD }}" = "true" ]; then
          make clean
        fi

        mka adbd ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)

        echo "::group::ccache stats"
        ccache -s
        echo "::endgroup::"

        OUT_DIR="out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
        if [ -z "$(find "$OUT_DIR" -maxdepth 1 \( -name '*.img' -o -name '*.zip' \) 2>/dev/null)" ]; then
          echo "::error::Build finished but no .img/.zip output was found in $OUT_DIR. Something went wrong even though mka returned success."
          exit 1
        fi
        echo "OUT_DIR=$FOX_DIR/$OUT_DIR" >> $GITHUB_ENV

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ env.OUT_DIR }}/*.img
          ${{ env.OUT_DIR }}/*.zip
        name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Target: ${{ github.event.inputs.BUILD_TARGET }}image
          Device Tree Commit: ${{ env.COMMIT_ID }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
