name: OrangeFox Build

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'URL Sinkronisasi OrangeFox'
        required: true
        default: 'https://gitlab.com/OrangeFox/sync.git'
      MANIFEST_BRANCH:
        description: 'Versi Manifest (e.g., 12.1)'
        required: true
        default: '12.1'
      DEVICE_TREE_URL:
        description: 'URL Device Tree'
        required: true
        default: 'https://github.com/rinnsakaguchi/twrp_device_infinix_X6886'
      DEVICE_TREE_BRANCH:
        description: 'Branch Device Tree'
        required: true
        default: 'ofox-12.1'
      DEVICE_PATH:
        description: 'Path Device (e.g., device/infinix/X6886)'
        required: true
        default: 'device/infinix/X6886'
      DEVICE_NAME:
        description: 'Nama Device (Codename)'
        required: true
        default: 'X6886'
      MAKEFILE_NAME:
        description: 'Nama Makefile (tanpa .mk)'
        required: true
        default: 'ofox_X6886'
      BUILD_TARGET:
        description: 'Target Build (recoveryimage / vendorboot)'
        required: true
        default: 'vendorboot'
      COMMON_TREE_URL:
        description: 'URL Common Tree (Opsional)'
        required: false
      COMMON_PATH:
        description: 'Path Common Tree (Opsional)'
        required: false

jobs:
  build:
    runs-on: ubuntu-22.04 # Disarankan 22.04 untuk stabilitas toolchain Android lama
    if: github.event.repository.owner.id == github.event.sender.id
    permissions:
      contents: write
    steps:
 
    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup Workspace
      uses: rokibhasansagar/slimhub_actions@main

    - name: Initialize Workspace
      id: pwd
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT

    - name: Prepare Build Environment
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        sudo apt update
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r) \
            git python3 tar aria2 python3-pip
        
        # Setup scripts
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
        sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
        sudo bash setup/install_android_sdk.sh

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'
    
    - name: Setup SSH Keys
      if: ${{ startsWith(github.event.inputs.DEVICE_TREE_URL, 'git@github.com') }}
      uses: webfactory/ssh-agent@v0.9.0
      with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Sync OrangeFox Sources
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        git clone ${{ github.event.inputs.SYNC_URL }}
        cd sync
        ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}

    - name: Clone Device Tree
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        cd fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}

    - name: Clone Common Tree
      if: ${{ github.event.inputs.COMMON_TREE_URL != '' && github.event.inputs.COMMON_PATH != '' }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        cd fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        git clone ${{ github.event.inputs.COMMON_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.COMMON_PATH }}

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Building Recovery
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        cd fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        
        # Set Environment Variables
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_REPLACE_TOOLBOX_GETPROP=1
        export LC_ALL="C"
        
        # Setup build environment
        source build/envsetup.sh
        
        # Lunch and Build
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-userdebug
        make clean
        mka ${{ github.event.inputs.BUILD_TARGET }} -j$(nproc --all)

    - name: Verify Output
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        OUT_PATH="fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
        ls -R $OUT_PATH

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.zip
          ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img
        name: OrangeFox-${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Build: OrangeFox Recovery
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Target: ${{ github.event.inputs.BUILD_TARGET }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
